[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwstrength"
version = "0.1.0"
description = "Dependency-free password strength estimation library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mackey-labs" }]

[tool.setuptools.packages.find]
include = ["pwstrength*"]
